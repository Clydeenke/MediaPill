[versions]
agp = "9.2.1"
kotlin = "2.4.10"
xposedApi = "102.0.0"
xposedService = "102.0.0"
appcompat = "1.7.0"
preference = "1.2.1"
activityCompose = "1.13.0"
miuix = "0.9.3"

[plugins]
agpApp = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "xposedApi" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "xposedService" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons", version.ref = "miuix" }
miuix-core = { group = "top.yukonga.miuix.kmp", name = "miuix-core", version.ref = "miuix" }
miuix-k = { group = "top.yukonga.miuix.kmp", name = "miuix-k", version.ref = "miuix" }
